<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>express server</title>
</head>
<body>
    <section>
        <h3>Текущие пользователи:</h3>
        <p id="all-users" style="color: green"></p>
        <br /><br />
    </section>
    <section>
        <h3>Проверить наличие пользователя</h3>
        <button id="get-users-btn">Update</button>
        <br /><br />
        <input type="text" placeholder="check username" id="check-user-input" />
        <button id="check-user-btn">Check</button>
        <p id="check-user-result"></p>
    </section>

    <section>
        <br /><br />
        <h3>Добавить пользователя</h3>
        <input type="text" placeholder="add user" id="add-user-input" />
        <button id="add-user-btn">Add</button>
    </section>

    <section>
        <br /><br />
        <h3>Переименовать пользователя</h3>
        <input type="text" placeholder="current username" id="current-username-input" />
        <input type="text" placeholder="new username" id="new-username-input" />
        <button id="edit-user-btn">Rename</button>
    </section>

    <section>
        <br /><br />
        <h3>Удалить пользователя</h3>
        <input type="text" placeholder="deleted user" id="deleted-user-input" />
        <button id="delete-user-btn">Delete</button>
    </section>
<script>
    /** получение списка всех пользователей */
    const get_users_btn = document.getElementById('get-users-btn');
    get_users_btn.addEventListener('click', getUsers);
    async function getUsers() {
        const resultArea = document.getElementById('all-users');

        const response = await fetch('/api/users', {
            method: 'GET',
            headers: { "Accept": "application/json" }
        })

        if (response.ok) {
            resultArea.textContent = '';
            const users = await response.json();
            users['res'].map(user => resultArea.textContent += `\n\n${user}`)
        } else {
            resultArea.textContent = 'error fetching data';
        }
    }


    /** проверка наличия пользователя */
    const check_user_btn = document.getElementById('check-user-btn');
    check_user_btn.addEventListener('click', checkUser);
    async function checkUser() {
        const checkedUsername = document.getElementById('check-user-input').value;
        const resultArea = document.getElementById('check-user-result');

        if (checkedUsername) {
            resultArea.textContent = '';
            const response = await fetch(`/api/users/${checkedUsername}`, {
                method: 'GET',
                headers: { "Accept": "application/json" }
            })

            if (response.ok) {
                const result = await response.json();
                resultArea.textContent = result['res'] ? `${checkedUsername} is in the base!` : `User ${checkedUsername} not found`;
            } else {
                resultArea.textContent = '???';
            }
        }

    }

    /** добавление нового пользователя */
    const add_user_btn = document.getElementById('add-user-btn');
    add_user_btn.addEventListener('click', addUser);
    async function addUser() {
        const newUsername = document.getElementById('add-user-input').value;
        if (newUsername) {
            const response = await fetch(`/api/users`, {
                method: 'POST',
                headers: { 
                    "Accept": "application/json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: newUsername
                })
            })

            if (response.ok) {
                getUsers();
            } else {
                alert('Не удалось добавить пользователя')
            }
        }
    }

    /** изменение имени существующего пользователя */
    const edit_user_btn = document.getElementById('edit-user-btn');
    edit_user_btn.addEventListener('click', renameUser);
    async function renameUser() {
        const currentUsername = document.getElementById('current-username-input').value;
        const newUsername = document.getElementById('new-username-input').value;
        if (currentUsername && newUsername) {
            const response = await fetch(`/api/users/${currentUsername}`, {
                method: 'PUT',
                headers: { 
                    "Accept": "application/json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    newname: newUsername
                })
            })

            if (response.ok) {
                getUsers();
            } else {
                alert('Не удалось переименовать пользователя')
            }
        }
    }

    /** удаление пользователя */
    const delete_user_btn = document.getElementById('delete-user-btn');
    delete_user_btn.addEventListener('click', deleteUser);
    async function deleteUser() {
        const deletedUsername = document.getElementById('deleted-user-input').value;
        if (deletedUsername) {
            const response = await fetch(`/api/users/${deletedUsername}`, {
                method: 'DELETE',
                headers: { 
                    "Accept": "application/json"
                }
            })

            if (response.ok) {
                getUsers();
            } else {
                alert('Не удалось удалить пользователя')
            }
        }
    }

    getUsers();
</script>
</body>
</html>
